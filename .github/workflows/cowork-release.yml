# Loukri AI CoWork release: build the desktop app for macOS (Apple silicon and
# Intel) and Windows, then publish a GitHub Release whose asset names are the
# ones the in-app updater (ui/desktop/src/utils/githubUpdater.ts) and the
# TokenKey download page (tokenkey.in/download) look for:
#
#   LoukriCoWork.zip                 macOS, Apple silicon
#   LoukriCoWork_intel_mac.zip       macOS, Intel
#   LoukriAICoWorkSetup.exe          Windows installer (Squirrel)
#   LoukriCoWork-win32-x64.zip       Windows 64-bit, portable
#   LoukriCoWork-win32-ia32.zip      Windows 32-bit (x86), portable, no code execution
#   latest-mac.yml + LoukriCoWork-darwin-*.zip   electron-updater feed (macOS)
#
# Push a tag `vX.Y.Z` to release. Run by hand to only build the artifacts.
name: CoWork Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the build (e.g. 1.51.1). Artifacts only, no release."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cowork-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"; else v="${REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

  macos-arm64:
    needs: version
    uses: ./.github/workflows/bundle-macos.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.version.outputs.version }}
      target: aarch64-apple-darwin
      package_desktop: true
      signing: ${{ vars.COWORK_SIGN_MACOS == 'true' }}
      environment: ${{ vars.COWORK_SIGN_MACOS == 'true' && 'signing' || '' }}
    secrets: inherit

  macos-intel:
    needs: version
    uses: ./.github/workflows/bundle-macos.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.version.outputs.version }}
      target: x86_64-apple-darwin
      package_desktop: true
      signing: ${{ vars.COWORK_SIGN_MACOS == 'true' }}
      environment: ${{ vars.COWORK_SIGN_MACOS == 'true' && 'signing' || '' }}
    secrets: inherit

  windows:
    needs: version
    uses: ./.github/workflows/bundle-windows.yml
    permissions:
      contents: read
      # The Windows signing job authenticates to Azure Trusted Signing with an
      # OIDC token; a caller that does not grant it cannot call the workflow
      # at all, even when signing is off.
      id-token: write
    with:
      version: ${{ needs.version.outputs.version }}
      package_desktop: true
      arch: x64
      signing: ${{ vars.COWORK_SIGN_WINDOWS == 'true' }}
      environment: ${{ vars.COWORK_SIGN_WINDOWS == 'true' && 'signing' || '' }}
    secrets: inherit

  # 32-bit Windows, which is the same thing as x86. Built without code
  # execution: V8 publishes no i686 binary, so the feature cannot be present
  # on this architecture. Everything else is identical to the x64 build.
  #
  # Electron 43 is the last version that can build this at all; 44 removed it
  # and 43 loses support in January 2027. Whoever does the next Electron
  # upgrade has to remove this job.
  windows-x86:
    needs: version
    uses: ./.github/workflows/bundle-windows.yml
    permissions:
      contents: read
      id-token: write
    with:
      version: ${{ needs.version.outputs.version }}
      package_desktop: true
      arch: ia32
      signing: ${{ vars.COWORK_SIGN_WINDOWS == 'true' }}
      environment: ${{ vars.COWORK_SIGN_WINDOWS == 'true' && 'signing' || '' }}
    secrets: inherit

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, macos-arm64, macos-intel, windows, windows-x86]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: "!internal-*"
          merge-multiple: true
          path: dist

      - name: Generate macOS update manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node ui/desktop/scripts/generate-mac-update-manifest.js --version "$VERSION" --directory dist

      - name: List release assets
        run: ls -la dist

      # Squirrel refuses to install when the package does not match the size
      # and hash recorded in RELEASES, and it says so only on the user's
      # machine. v1.51.6 shipped a 32-bit RELEASES beside a 64-bit nupkg and
      # every Windows 64-bit install failed. Catch that here instead.
      - name: Verify the Squirrel manifest matches the package
        working-directory: dist
        run: |
          set -euo pipefail
          nupkg=$(ls *-full.nupkg)
          # RELEASES is "<sha1> <filename> <bytes>", and is written with a BOM.
          read -r _ manifest_name manifest_size < <(tr -d '\r\357\273\277' < RELEASES | head -1)
          actual_size=$(wc -c < "$nupkg" | tr -d ' ')
          echo "RELEASES names $manifest_name at $manifest_size bytes"
          echo "on disk        $nupkg at $actual_size bytes"
          if [ "$manifest_name" != "$nupkg" ] || [ "$manifest_size" != "$actual_size" ]; then
            echo "::error::RELEASES does not describe $nupkg. Two architectures' Squirrel output have collided; the installer would fail on every Windows machine."
            exit 1
          fi
          echo "manifest and package agree"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          assets=(
            LoukriCoWork.zip
            LoukriCoWork_intel_mac.zip
            LoukriCoWork-darwin-arm64.zip
            LoukriCoWork-darwin-x64.zip
            latest-mac.yml
            mac-update-requirements.json
            LoukriCoWork-win32-x64.zip
            LoukriCoWork-win32-ia32.zip
            LoukriAICoWorkSetup.exe
            RELEASES
          )
          for f in *.nupkg; do [ -f "$f" ] && assets+=("$f"); done
          for f in "${assets[@]}"; do [ -f "$f" ] || { echo "missing $f"; exit 1; }; done
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Loukri AI CoWork $VERSION" \
            --notes "Loukri AI CoWork $VERSION — desktop app for macOS and Windows, powered by TokenKey (tokenkey.in)." \
            --latest
